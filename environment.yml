name: tactile_reconstruction
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy>=1.24.0
  - scipy>=1.10.0
  - matplotlib>=3.7.0
  - pyyaml>=6.0

  # PyTorch (根据你的CUDA版本选择)
  # CPU版本
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly

  # 或 GPU版本 (取消注释，并注释上面的CPU版本)
  # - pytorch>=2.0.0
  # - torchvision>=0.15.0
  # - pytorch-cuda=11.8

  # pip安装的包
  - pip:
    - opencv-python>=4.8.0
    - opencv-contrib-python>=4.8.0
    - tqdm>=4.65.0
